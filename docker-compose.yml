
services:
  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      SMTP_INBOUND_PORT: "0"
    expose:
      - "3000"
    volumes:
      - mailflare-data:/data

volumes:
  mailflare-data:
