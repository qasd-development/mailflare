
services:
  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      APP_URL: "https://mail.qasd.dev"
      SMTP_INBOUND_PORT: "0"
      SMTP_URL: "${SMTP_URL}"

    expose:
      - "3000"

    volumes:
      - mailflare-data:/data

volumes:
  mailflare-data:
